<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#F8F4EF;font-family:'Noto Sans JP',sans-serif;color:#4A403A}
.wrap{position:relative;width:1080px;height:1920px;background:
 radial-gradient(circle at 12% 88%, #F6E6DA 0%, rgba(246,230,218,0) 40%),
 radial-gradient(circle at 92% 70%, #EFE6F0 0%, rgba(239,230,240,0) 38%),#F8F4EF}
.photo{position:absolute;left:0;top:360px;width:1080px;height:520px;background:url(photo.jpg) center/cover;
 -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,0) 0%,#000 14%,#000 58%,rgba(0,0,0,0) 88%);
 mask-image:linear-gradient(to bottom,rgba(0,0,0,0) 0%,#000 14%,#000 58%,rgba(0,0,0,0) 88%)}
.logo{position:absolute;left:64px;top:270px;width:230px}
.tag{position:absolute;right:64px;top:284px;font-family:'Shippori Mincho',serif;font-size:36px;font-weight:600;color:#C2703A;letter-spacing:.08em}
.tag:after{content:"";display:block;height:2px;margin-top:6px;background:linear-gradient(90deg,rgba(194,112,58,0),#C2703A 30%,#C2703A 70%,rgba(194,112,58,0))}
.main{position:absolute;left:0;right:0;top:790px;text-align:center}
.lead{display:inline-flex;align-items:center;gap:22px;font-size:46px;font-weight:700;color:#6E5F55;letter-spacing:.12em}
.lead:before,.lead:after{content:"";width:70px;height:2px;background:#B9A595}
.big{font-family:'Shippori Mincho',serif;font-weight:800;font-size:160px;line-height:1.15;color:#C2703A;letter-spacing:.1em;margin-top:2px}
.dates{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:6px;font-family:'Shippori Mincho',serif}
.old{position:relative;font-size:76px;font-weight:600;color:#9C918A}
.old:after{content:"";position:absolute;left:-8px;right:-8px;top:52%;height:5px;background:#C2703A;transform:rotate(-8deg);border-radius:3px}
.arrow{width:64px;height:36px}
.new{font-size:150px;font-weight:800;color:#C2703A;line-height:1}
.new small{font-size:52px;font-weight:700;margin-left:6px;color:#4A403A}
.band{position:absolute;left:0;right:0;bottom:0;height:600px;padding:60px 56px 350px;color:#fff;
 background:linear-gradient(180deg,#F8F4EF 0%,rgba(248,244,239,0) 9%),linear-gradient(100deg,#B86A37 0%,#CF8A55 100%);
 display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.offer{font-size:46px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.offer b{font-family:'Shippori Mincho',serif;font-size:76px;font-weight:800;margin:0 4px}
.sub{font-size:30px;font-weight:500;letter-spacing:.04em}
.note{font-size:17px;text-align:center;line-height:1.5;opacity:.95}
</style></head><body><div class="wrap">
<div class="photo"></div>
<img class="logo" src="logo.png" alt="the SILK">
<div class="tag">5周年キャンペーン</div>
<div class="main">
 <div class="lead">ご好評につき</div>
 <div class="big">期限延長</div>
 <div class="dates">
  <span class="old">11/13</span>
  <svg class="arrow" viewBox="0 0 64 36" aria-hidden="true"><path d="M2 18H56M42 4L58 18 42 32" fill="none" stroke="#C2703A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span class="new">11/30<small>まで</small></span>
 </div>
</div>
<div class="band">
 <div class="offer">月会費 最大3か月<b>50%OFF</b></div>
 <div class="sub">入会金・登録手数料0円 ・ 50分の無料体験 ・ 手ぶらでOK</div>
 <div class="note">※適用条件あり ※Fullプランエリアの場合 <br>※キャンペーン期間：2026/10/1〜2026/11/30（11/30までに予約完了、12/14までにご来店）</div>
</div>
</div></body></html>
