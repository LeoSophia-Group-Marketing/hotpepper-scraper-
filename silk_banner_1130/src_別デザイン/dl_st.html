<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Noto+Sans+JP:wght@500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#F6F2EE;font-family:'Noto Sans JP',sans-serif;color:#4A3F3A;position:relative}
.ph{position:absolute;left:0;top:0;width:1080px;height:600px;background:url(class2.jpg) 50% 22%/cover}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,242,238,0) 72%,#F6F2EE 100%)}
.cap{position:absolute;left:40px;top:250px;background:rgba(255,255,255,.88);border-radius:999px;padding:8px 20px;font-size:22px;font-weight:700;color:#8C6E62;letter-spacing:.06em}
.r{position:absolute;left:80px;top:440px;width:920px}
.logo{width:200px;display:block;margin-bottom:14px}
.lead{margin-top:20px;font-size:36px;font-weight:700;color:#A2867A;letter-spacing:.12em;display:flex;align-items:center;gap:14px;white-space:nowrap}
.lead:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,#C7A497,rgba(199,164,151,0))}
.big{font-family:'Shippori Mincho',serif;font-weight:800;font-size:100px;line-height:1.05;margin-top:8px;letter-spacing:.02em;color:#4A3F3A}
.date{margin-top:6px;display:flex;align-items:baseline;gap:8px;font-family:'Shippori Mincho',serif;color:#B5776A}
.date b{font-size:80px;font-weight:800;line-height:1}
.date span{font-family:'Noto Sans JP';font-size:40px;font-weight:700;color:#4A3F3A}
.copy{margin-top:20px;padding-top:16px;border-top:2px solid #E6D6CE;font-family:'Shippori Mincho',serif;font-weight:700;font-size:38px;line-height:1.38;color:#5C4E47;white-space:nowrap}
.copy em{font-style:normal;color:#B5776A}
.tag{margin-top:24px;display:inline-flex;align-items:baseline;gap:12px;background:#B9A190;border-radius:10px;padding:10px 24px;font-size:30px;font-weight:700;color:#fff}
.tag b{font-family:'Shippori Mincho',serif;font-size:52px}
.bdg{display:block;width:600px;margin-top:26px}
.cp{margin-top:30px;display:inline-flex;flex-direction:column;align-items:flex-start}.cp .tag{margin-top:0;border-radius:8px;white-space:nowrap;font-size:26px;padding:8px 20px}.cp .tag b{font-size:46px}.rb{color:#9A7B6E;font-weight:700;font-size:34px;letter-spacing:.12em;padding:0 0 8px 2px}
.mid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:22px}.mid .cp{margin-top:0}.mid .bdg{width:400px;margin-top:0}
.band{position:absolute;left:0;top:1052px;width:1080px}
</style></head><body>
<div class="ph"></div>
<div class="r">
 <img class="logo" src="logo.png" alt="the SILK">
 <div class="big">まもなく終了</div>
 <div class="date"><b>11/30</b><span>（月）まで</span></div>
 <div class="mid"><div class="cp"><div class="rb">5周年キャンペーン</div><div class="tag">3か月最大<b>¥40,000</b>OFF</div></div><img class="bdg" src="badges.png" alt=""></div>
 <div class="copy">運動が<em>苦手な人ほど</em>、<br>通いやすい女性専用ピラティス。</div>
</div>
<img class="band" src="band.png" alt="">
</body></html>
