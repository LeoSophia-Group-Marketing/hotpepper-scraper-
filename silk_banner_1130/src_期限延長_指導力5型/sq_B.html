<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Noto+Sans+JP:wght@500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;background:url(base_sq.png) 0 0/1080px 1080px no-repeat}
.blk{position:absolute;left:52px;top:206px;width:570px;color:#4F4540}
.lead{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:31px;letter-spacing:.14em;color:#8A7766;display:flex;align-items:center;gap:14px}
.lead:after{content:"";flex:0 0 120px;height:2px;background:linear-gradient(90deg,#B7A493,rgba(183,164,147,0))}
.big{font-family:'Shippori Mincho',serif;font-weight:800;font-size:92px;line-height:1.05;letter-spacing:.02em;margin-top:4px}
.dates{display:flex;align-items:baseline;gap:16px;margin-top:6px;font-family:'Shippori Mincho',serif}
.old{position:relative;font-size:46px;font-weight:700;color:#A79C93}
.old:after{content:"";position:absolute;left:-6px;right:-6px;top:56%;height:4px;background:#A08A76;transform:rotate(-9deg);border-radius:2px}
.arr{font-family:'Noto Sans JP';font-size:40px;font-weight:700;color:#A08A76;transform:translateY(-6px)}
.new{font-size:76px;font-weight:800;color:#A08A76;line-height:1}
.new small{font-family:'Noto Sans JP',sans-serif;font-size:32px;font-weight:700;color:#4F4540;margin-left:6px}
.ex{font-size:.8em;margin-left:-.05em}</style></head><body>
<div class="blk">
 <div class="lead">ご要望にお応えして</div>
 <div class="big">延長します</div>
 <div class="dates"><span class="old">11/13</span><span class="arr">→</span><span class="new">11/30<small>まで</small></span></div>
</div></body></html>
